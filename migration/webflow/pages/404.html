<style>
/* =========================
   MAIN NAV LINKS (TOP BAR)
   ========================= */

/* Base top-nav link */
.navbar2_link {
  position: relative;
  display: inline-flex;
  align-items: center;
  padding-left: 0;
  padding-right: 0;
  margin-inline: 1rem;
  color: #0C2954; /* default text color */
}

/* Underline animation */
.navbar2_link::after {
  content: '';
  position: absolute;
  bottom: -0.05rem;
  left: 0;
  width: 100%;
  height: 0.125rem;
  background-color: #0C2954; /* default underline color */
  transform: scaleX(0);
  transform-origin: left;
  transition:
    transform 0.22s ease-out,
    background-color 0.2s ease-out;
}

/* Hover — both text & underline turn orange */
.navbar2_link:hover {
  color: #FF5B19;
}

.navbar2_link:hover::after {
  transform: scaleX(1);
  transform-origin: left;
  background-color: #FF5B19;
}

/* Hover out — underline collapses right → left */
.navbar2_link:not(:hover)::after {
  transform-origin: right;
}

/* Active page — keep orange text + underline visible */
.navbar2_link.w--current {
  color: #FF5B19;
}

.navbar2_link.w--current::after {
  transform: scaleX(1);
  transform-origin: left;
  background-color: #FF5B19;
}

/* =========================
   DROPDOWN SUB-LINKS
   ========================= */

/* Base dropdown link */
.navbar2_dropdown-link {
  color: #111111;          /* default dropdown text color */
  transition: color 0.2s ease-out;
}

/* Hover inside dropdown — orange, no underline */
.navbar2_dropdown-link:hover {
  color: #FF5B19;
}

/* Current dropdown page — stay orange */
.navbar2_dropdown-link.w--current {
  color: #FF5B19;
}

/* =========================
   DROPDOWN CHEVRON
   ========================= */

/* Chevron uses currentColor via the SVG, so it will follow the link color. */
.navbar2_dropdown-toggle .dropdown-chevron svg {
  transition: transform 0.2s ease-out;
}

/* Rotate chevron when dropdown is open */
.navbar2_dropdown-toggle.w--open .dropdown-chevron svg {
  transform: rotate(180deg);
}
</style>

<!-- JS: if any Solutions sub-link is current, mark Solutions toggle as current -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // 1) Find the current dropdown link.
    // Webflow normally uses .w--current, but we'll also check aria-current just in case.
    var currentDropdownLink =
      document.querySelector(
        '.navbar2_dropdown-link.w--current'
      ) ||
      document.querySelector(
        '.navbar2_dropdown-link[aria-current="page"], .navbar2_dropdown-link[aria-current="true"]'
      );

    if (!currentDropdownLink) return;

    // 2) Climb up to the Solutions dropdown wrapper
    //    (try your custom class, then the generic Webflow dropdown wrapper).
    var dropdownWrapper =
      currentDropdownLink.closest('.navbar2_menu-dropdown') ||
      currentDropdownLink.closest('.w-dropdown');

    if (!dropdownWrapper) return;

    // 3) Inside that wrapper, find the Solutions toggle element
    var solutionsToggle =
      dropdownWrapper.querySelector('.navbar2_dropdown-toggle');

    if (!solutionsToggle) return;

    // 4) Add w--current so it uses the same styling as other active nav links
    solutionsToggle.classList.add('w--current');
  });
</script>

<script>
(function () {
  const DEFAULTS = {
    selector: '[data-gsap-lines]',
    y: 26,
    duration: 0.85,
    stagger: 0.12,
    delay: 0.25,
    ease: 'power3.out',
    start: 'top 85%',
  };

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function ensureLibs() {
    if (!window.SplitType) await loadScript('https://unpkg.com/split-type');
    if (!window.gsap) await loadScript('https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js');
    if (!window.ScrollTrigger) await loadScript('https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js');
    if (window.gsap && window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);
  }

  const instances = new Map();

  function killTriggerFor(el) {
    if (!window.ScrollTrigger) return;
    ScrollTrigger.getAll().forEach(t => {
      if (t?.vars?.trigger === el) t.kill();
    });
  }

  function getNumAttr(el, name, fallback) {
    const raw = el.getAttribute(name);
    if (raw == null || raw === '') return fallback;
    const n = Number(String(raw).trim().replace(',', '.'));
    return Number.isFinite(n) ? n : fallback;
  }

  function getStrAttr(el, name, fallback) {
    const raw = el.getAttribute(name);
    return (raw == null || raw === '') ? fallback : String(raw);
  }

  function splitToLines(el) {
    // revert previous instance (важливо на resize)
    if (instances.has(el)) {
      try { instances.get(el).revert(); } catch (e) {}
      instances.delete(el);
    }

    const inst = new SplitType(el, { types: 'lines', lineClass: 'line' });
    instances.set(el, inst);

    // wrap each line content into span (рухаємо span, line = маска)
    el.querySelectorAll('.line').forEach(line => {
      const span = document.createElement('span');
      while (line.firstChild) span.appendChild(line.firstChild);
      line.appendChild(span);
    });

    return el.querySelectorAll('.line > span');
  }

  function prepareHidden(el) {
    // прибираємо FOUC: елемент видимий тільки коли ми вже підготували split + set()
    el.style.visibility = 'hidden';
  }

  function reveal(el) {
    el.style.visibility = 'visible';
  }

  function animate(el) {
    // per-element overrides (через атрибути)
    const delay   = getNumAttr(el, 'data-gsap-delay', DEFAULTS.delay);
    const stagger = getNumAttr(el, 'data-gsap-stagger', DEFAULTS.stagger);
    const y       = getNumAttr(el, 'data-gsap-y', DEFAULTS.y);
    const dur     = getNumAttr(el, 'data-gsap-duration', DEFAULTS.duration);
    const start   = getStrAttr(el, 'data-gsap-start', DEFAULTS.start);

    // split
    const parts = splitToLines(el);
    if (!parts || !parts.length) {
      // якщо нічого не розбилося — покажемо як є
      reveal(el);
      return;
    }

    killTriggerFor(el);

    // set initial state BEFORE making it visible
    gsap.set(parts, { y, opacity: 0 });
    reveal(el);

    gsap.to(parts, {
      y: 0,
      opacity: 1,
      duration: dur,
      ease: DEFAULTS.ease,
      stagger,
      delay,
      scrollTrigger: {
        trigger: el,
        start,
        once: true
      }
    });
  }

  function initAll() {
    const els = document.querySelectorAll(DEFAULTS.selector);
    els.forEach(prepareHidden);
    els.forEach(animate);
  }

  // debounce resize (перерахунок line-breaks)
  let rAF = null;
  function onResize() {
    if (rAF) cancelAnimationFrame(rAF);
    rAF = requestAnimationFrame(() => {
      initAll();
      if (window.ScrollTrigger) ScrollTrigger.refresh();
    });
  }

  document.addEventListener('DOMContentLoaded', async () => {
    await ensureLibs();
    initAll();
    window.addEventListener('resize', onResize);
  });
})();
</script>
